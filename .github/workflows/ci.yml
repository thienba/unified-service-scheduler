name: CI

on:
  push:
  pull_request:

# Read-only for the whole workflow (SEC-16.AC-4).
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installs from package-lock.json and fails if package.json and the lockfile disagree.
      - run: npm ci

      - name: Runtime dependencies are approved
        run: npm run check:deps
      - name: Workflows are pinned and read-only
        run: npm run check:workflows

      - name: Audit runtime dependencies (high and critical fail the build)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all dependencies (warning only)
        run: npm audit
        continue-on-error: true

      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests in two time zones
        run: npm run test:tz
      - name: All tests with coverage
        run: npm run test:coverage
      - run: npm run build
      - name: A remote-mode build holds nothing that is only for the demo
        run: npm run check:remote-build

      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage
          if-no-files-found: ignore

  # The browser tests run apart from the checks above: in one job they took longer than its 20 minutes.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests in Chromium, part ${{ matrix.shard }} of 4
        run: npm run e2e -- --shard=${{ matrix.shard }}/4

      - name: Keep the test videos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-chromium-${{ matrix.shard }}
          path: test-results
          if-no-files-found: ignore

  # Firefox and WebKit are a warning only (architecture.md section 7.9).
  e2e-other:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - name: End-to-end tests in Firefox and WebKit (warning only)
        run: npm run e2e:other

      - name: Keep the test videos
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-other
          path: test-results
          if-no-files-found: ignore
